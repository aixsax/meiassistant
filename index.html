<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mei Assistant | AI</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background: #111827; padding: 15px 25px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.3rem; color: #38bdf8; }
        #durum { font-size: 0.85rem; color: #4ade80; background: #1e293b; padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; }
        #sohbet-alani { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; width: 100%; margin: 0 auto; }
        .mesaj { padding: 14px 18px; border-radius: 12px; max-width: 82%; line-height: 1.5; font-size: 0.95rem; }
        .kullanici { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #1e293b; border: 1px solid #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
        .etiket { display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; background: #0f172a; color: #38bdf8; border: 1px solid #1e3a8a; }
        .alt-panel { background: #111827; padding: 15px 20px; border-top: 1px solid #1f2937; }
        .girdi-kutusu { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #374151; background: #0b0f19; color: white; font-size: 0.95rem; outline: none; }
        button { padding: 12px 24px; background: #38bdf8; color: #0b0f19; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Mei Assistant</h1>
        <div id="durum">⏳ Eğitilmiş Beyin Yükleniyor...</div>
    </header>
    <div id="sohbet-alani">
        <div class="mesaj bot">
            <div class="etiket">Sistem Aktif</div><br>
            Merhaba! Ben <b>Mei Assistant</b>. Google Colab üzerinde eğitilmiş özel veri setim, canlı bilgi kütüphanem ve tarayıcı içi yapay zeka motorumla sorularını yanıtlamaya hazırım!
        </div>
    </div>
    <div class="alt-panel">
        <div class="girdi-kutusu">
            <input type="text" id="mesaj-input" placeholder="Sorunuzu yazın...">
            <button id="gonder-btn">Gönder</button>
        </div>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

        const durumEl = document.getElementById('durum');
        const sohbetAlani = document.getElementById('sohbet-alani');
        const inputEl = document.getElementById('mesaj-input');
        const btnEl = document.getElementById('gonder-btn');

        let fuse = null;
        let aiModel = null;

        // 1. Kütüphane: Colab'de Eğittiğimiz veriseti.json Dosyasını Yükle
        async function baslat() {
            try {
                const res = await fetch('./veriseti.json');
                const veriler = await res.json();
                fuse = new Fuse(veriler, { keys: ['soru'], threshold: 0.42 });
                durumEl.innerText = `● Hazır (${veriler.length} Eğitilmiş Bilgi + Canlı AI)`;
            } catch (e) {
                durumEl.innerText = '● Çevrimiçi (Canlı Mod)';
            }

            // 3. Kütüphane: Arka Planda Qwen Tarayıcı Modelini Hazırla
            try {
                aiModel = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', { dtype: 'q4' });
            } catch (e) { console.log("Yerel model beklemede."); }
        }

        // 2. Kütüphane: Canlı Bilgi Bankası Araması
        async function bilgiBankasiAra(soru) {
            try {
                const temiz = soru.replace(/nedir|kimdir|ne demek|hakkında/gi, '').trim();
                const url = `https://tr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(temiz)}&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                if (data?.query?.search?.length > 0) {
                    const sonuc = data.query.search[0];
                    return `**${sonuc.title}:** ` + sonuc.snippet.replace(/<[^>]*>?/gm, '') + '...';
                }
            } catch (e) {}
            return null;
        }

        function mesajEkle(metin, kim, kaynak = '') {
            const div = document.createElement('div');
            div.className = `mesaj ${kim}`;
            div.innerHTML = (kaynak ? `<div class="etiket">${kaynak}</div><br>` : '') + marked.parse(metin);
            sohbetAlani.appendChild(div);
            sohbetAlani.scrollTop = sohbetAlani.scrollHeight;
            return div;
        }

        async function gonder() {
            const soru = inputEl.value.trim();
            if (!soru) return;
            inputEl.value = '';
            mesajEkle(soru, 'kullanici');

            // 1. ADIM: Colab'de eğittiğimiz veriseti.json içinde ara
            if (fuse) {
                const sonuc = fuse.search(soru);
                if (sonuc.length > 0) {
                    mesajEkle(sonuc[0].item.cevap, 'bot', `📚 1. Kütüphane: ${sonuc[0].item.kaynak || 'Colab Eğitimi'}`);
                    return;
                }
            }

            // 2. ADIM: Canlı Bilgi Kütüphanesinde ara
            const wiki = await bilgiBankasiAra(soru);
            if (wiki && (!aiModel || soru.toLowerCase().includes('nedir') || soru.toLowerCase().includes('kimdir'))) {
                mesajEkle(wiki, 'bot', '🌐 2. Kütüphane: Açık Kaynak Bilgi Bankası');
                return;
            }

            // 3. ADIM: Sinir Ağı Modeli ile sıfırdan üret
            if (aiModel) {
                const bekle = mesajEkle('Düşünüyor...', 'bot', '🧠 3. Kütüphane: Qwen AI Motoru');
                const cikti = await aiModel([
                    { role: 'system', content: 'Sen Mei Assistant adında Türkçe konuşan yardımsever bir yapay zekasın.' },
                    { role: 'user', content: soru }
                ], { max_new_tokens: 160 });
                bekle.innerHTML = `<div class="etiket">🧠 3. Kütüphane: Qwen AI Motoru</div><br>` + marked.parse(cikti[0].generated_text.at(-1).content);
            } else if (wiki) {
                mesajEkle(wiki, 'bot', '🌐 2. Kütüphane: Açık Kaynak Bilgi Bankası');
            } else {
                mesajEkle('Bu soruyu not aldım! Bir sonraki Colab eğitiminde veri setime ekleyebilirsin.', 'bot', '🤖 Mei Assistant');
            }
        }

        btnEl.onclick = gonder;
        inputEl.onkeypress = (e) => { if (e.key === 'Enter') gonder(); };
        baslat();
    </script>
</body>
</html>
